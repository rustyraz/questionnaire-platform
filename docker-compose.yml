services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: questionnaire_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/questionnaire_db
    volumes:
      - ./apps/api:/app/apps/api
      - /app/apps/api/node_modules
    depends_on:
      db:
        condition: service_healthy
  admin-ui:
    build:
      context: .
      dockerfile: apps/admin-ui/Dockerfile
      target: development
    ports:
      - '3001:3000'
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/questionnaire_db
    volumes:
      - ./apps/admin-ui:/app/apps/admin-ui
      - /app/apps/admin-ui/node_modules
    depends_on:
      - api

volumes:
  pgdata: